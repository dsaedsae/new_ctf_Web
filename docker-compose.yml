services:
  # Stage 1 & 3 & 5: Authorization Server (Flask + SQLite)
  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    container_name: oauth-ctf-auth-server
    environment:
      - FLASK_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - BASE_URL=${BASE_URL}
    depends_on: []
    networks:
      - auth-network  # Only auth network - isolated from api-network
    volumes:
      - auth_server_data:/app/data

    # Security hardening
    security_opt:
      - no-new-privileges:true
      - apparmor=docker-default
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=50M,mode=1777
      - /run:size=10M,mode=755
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Stage 2: Fresh Client (Flask)
  fresh-client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: oauth-ctf-fresh-client
    # Port not exposed externally - access via nginx only
    environment:
      - FLASK_ENV=production
      - BASE_URL=${BASE_URL}
      - INTERNAL_BASE_URL=http://nginx
    networks:
      - frontend-network
      - auth-network  # Add auth-network to communicate with auth-server

  # Stage 4 & 5: Resource Server (Flask)
  resource-server:
    build:
      context: ./resource-server
      dockerfile: Dockerfile
    container_name: oauth-ctf-resource-server
    environment:
      - FLASK_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      - BASE_URL=${BASE_URL}
    networks:
      - api-network  # Only api network - isolated from auth-network

  # Nginx Reverse Proxy - Single Entry Point
  nginx:
    image: nginx:alpine
    container_name: oauth-ctf-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-server
      - fresh-client
      - resource-server
    networks:
      - auth-network
      - frontend-network
      - api-network

networks:
  auth-network:
    driver: bridge
    internal: true  # Block external internet access (prevents reverse shells)
  frontend-network:
    driver: bridge
  api-network:
    driver: bridge

volumes:
  auth_server_data:
    driver: local