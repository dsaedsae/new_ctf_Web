events {
    worker_connections 1024;
}

http {
    upstream auth-server {
        server auth-server:8000;
    }

    upstream fresh-client {
        server fresh-client:8001;
    }

    upstream resource-server {
        server resource-server:8002;
    }

    server {
        listen 80;
        server_name localhost;

        # Robots.txt (hint for hidden endpoints)
        location /robots.txt {
            proxy_pass http://auth-server/robots.txt;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Well-known endpoints (OAuth discovery, JWKS)
        location /.well-known/ {
            proxy_pass http://auth-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # OAuth endpoints (direct to auth server)
        location /oauth/ {
            proxy_pass http://auth-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin endpoints (auth server)
        location /admin/ {
            proxy_pass http://auth-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Main entry point - Fresh Client
        location / {
            proxy_pass http://fresh-client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Resource Server API routes
        location /api/ {
            proxy_pass http://resource-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}